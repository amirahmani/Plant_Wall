name: Export project board

# Writes site-data/plant-project.json (Kanban status, roadmap dates, latest commits)
# for the portfolio website. Needs a PROJECT_TOKEN repository secret: a classic
# personal access token with the read:project and public_repo scopes.

on:
  schedule:
    - cron: "17 9 * * *"     # once a day, 4:17 AM Detroit (EST), before the site sync at 5:39
  workflow_dispatch:          # run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: project-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export project
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_OWNER: amirahmani
          PROJECT_NUMBER: "1"
        run: python3 .github/scripts/export_project.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- site-data; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site-data
          git commit -m "Update project export [skip ci]"
          git push
