# Workspace: two crates that build together.
#   firmware/     the STM32 program (pins, ADC, LCD, flash, main loop)
#   plant_logic/  pure logic with no hardware dependencies, unit-tested on the PC
[workspace]
members = ["firmware", "plant_logic"]
default-members = ["firmware"]   # plain `cargo build` / `cargo run` = the firmware, as before
resolver = "3"

# Profiles must live in the workspace root
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
